<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần mềm Báo Cơm Nội Bộ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 800px;">
        
        <!-- HEADER -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">PHẦN MỀM BÁO CƠM NỘI BỘ</h2>
            <p class="text-muted">Đăng ký suất ăn trưa / tối hàng ngày</p>
        </div>

        <!-- 1. MÀN HÌNH ĐĂNG NHẬP -->
        <div id="loginSection" class="card shadow-sm p-4 mb-4">
            <h4 class="card-title text-center mb-3">Đăng Nhập</h4>
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập">
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu">
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Ghi nhớ đăng nhập</label>
            </div>
            <button class="btn btn-primary w-100" onclick="login()">Đăng Nhập</button>
        </div>

        <!-- 2. MÀN HÌNH CHÍNH (Sau khi đăng nhập thành công) -->
        <div id="mainSection" class="d-none">
            
            <!-- THANH THÔNG TIN VÀ NÚT ĐĂNG XUẤT -->
            <div class="card p-3 mb-4 d-flex flex-row justify-content-between align-items-center bg-white shadow-sm">
                <h5 id="welcomeText" class="mb-0 text-success fw-bold"></h5>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">Đăng xuất</button>
            </div>

            <!-- FORM BÁO CƠM -->
            <div class="card shadow-sm p-4 mb-4">
                <h5 class="card-title mb-3">Đăng ký báo cơm</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Chọn ngày báo cơm</label>
                        <input type="date" id="mealDate" class="form-control">
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="checkTrua">
                                <label class="form-check-label" for="checkTrua">Cơm trưa</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="checkToi">
                                <label class="form-check-label" for="checkToi">Cơm tối</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="checkLichTruc">
                                <label class="form-check-label" for="checkLichTruc">Lịch trực</label>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="btn btn-success mt-3" onclick="submitMeal()">Lưu báo cơm</button>
            </div>

            <!-- QUẢN LÝ DÀNH CHO ADMIN -->
            <div id="adminForm" class="card shadow-sm p-4 mb-4 d-none">
                <h5 class="card-title mb-3 text-danger">Quản lý hệ thống (Admin)</h5>
                
                <!-- Tạo tài khoản -->
                <div class="row g-2 mb-3">
                    <div class="col-md-5">
                        <input type="text" id="newUsername" class="form-control" placeholder="Tên đăng nhập mới">
                    </div>
                    <div class="col-md-5">
                        <input type="text" id="newName" class="form-control" placeholder="Họ và tên">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-danger w-100" onclick="createUser()">Tạo User</button>
                    </div>
                </div>

                <!-- Phân quyền xem thống kê -->
                <h6>Phân quyền xem thống kê:</h6>
                <div id="userPermissionsList" class="list-group">
                    <!-- Danh sách user sẽ được render tại đây -->
                </div>
            </div>

            <!-- PHẦN THỐNG KÊ BÁO CƠM -->
            <div id="statsForm" class="card shadow-sm p-4 mb-4 d-none">
                <h5 class="card-title mb-3">Thống kê báo cơm toàn công ty</h5>
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>Ngày</th>
                            <th>Tài khoản</th>
                            <th>Trưa</th>
                            <th>Tối</th>
                            <th>Lịch trực</th>
                        </tr>
                    </thead>
                    <tbody id="statsTableBody">
                        <!-- Dữ liệu render tại đây -->
                    </tbody>
                </table>
            </div>

        </div>

    </div>

    <!-- SCRIPT XỬ LÝ CHÍNH -->
    <script>
        let currentUser = null;

        // Tự động điền ngày hôm nay vào ô chọn ngày
        document.getElementById('mealDate').valueAsDate = new Date();

        // Nạp thông tin tài khoản nếu đã chọn Ghi nhớ (Không tự động đăng nhập)
        window.onload = function() {
            fillSavedCredentials();
        };

        // Hàm đọc localStorage và điền dữ liệu sẵn vào Form
        function fillSavedCredentials() {
            const savedUser = localStorage.getItem('saved_username');
            const savedPass = localStorage.getItem('saved_password');
            if (savedUser && savedPass) {
                document.getElementById('username').value = savedUser;
                document.getElementById('password').value = savedPass;
                document.getElementById('rememberMe').checked = true;
            }
        }

        // Đăng nhập
        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const remember = document.getElementById('rememberMe').checked;

            if (!u || !p) {
                alert('Vui lòng nhập tên đăng nhập và mật khẩu!');
                return;
            }

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();

            if (data.success) {
                currentUser = data.user;

                // Xử lý Ghi nhớ Đăng nhập vào LocalStorage
                if (remember) {
                    localStorage.setItem('saved_username', u);
                    localStorage.setItem('saved_password', p);
                } else {
                    localStorage.removeItem('saved_username');
                    localStorage.removeItem('saved_password');
                }

                // Chuyển đổi giao diện
                document.getElementById('loginSection').classList.add('d-none');
                document.getElementById('mainSection').classList.remove('d-none');
                document.getElementById('welcomeText').innerText = `Xin chào: ${currentUser.name}`;

                // Hiển thị phần Thống Kê nếu được cấp quyền
                if (currentUser.canViewStats) {
                    document.getElementById('statsForm').classList.remove('d-none');
                    loadStats();
                } else {
                    document.getElementById('statsForm').classList.add('d-none');
                }

                // Hiển thị phần Admin
                if (currentUser.role === 'admin') {
                    document.getElementById('adminForm').classList.remove('d-none');
                    loadUserPermissions();
                } else {
                    document.getElementById('adminForm').classList.add('d-none');
                }
            } else {
                alert(data.message);
            }
        }

        // Đăng xuất
        function logout() {
            // Reset người dùng hiện tại
            currentUser = null;

            // Chuyển giao diện về form Đăng Nhập
            document.getElementById('mainSection').classList.add('d-none');
            document.getElementById('statsForm').classList.add('d-none');
            document.getElementById('adminForm').classList.add('d-none');
            document.getElementById('loginSection').classList.remove('d-none');

            // Tự động nạp lại dữ liệu đã lưu sẵn (nếu có) nhưng không tự đăng nhập
            fillSavedCredentials();
        }

        // Thành viên Báo Cơm
        async function submitMeal() {
            const date = document.getElementById('mealDate').value;
            const trua = document.getElementById('checkTrua').checked;
            const toi = document.getElementById('checkToi').checked;
            const isLichTruc = document.getElementById('checkLichTruc').checked;

            const res = await fetch('/api/register-meal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, date, trua, toi, isLichTruc })
            });
            const data = await res.json();
            alert(data.message);

            if (data.success && currentUser.canViewStats) {
                loadStats();
            }
        }

        // Admin: Tạo tài khoản
        async function createUser() {
            const u = document.getElementById('newUsername').value;
            const n = document.getElementById('newName').value;
            const res = await fetch('/api/admin/create-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, name: n })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) {
                document.getElementById('newUsername').value = '';
                document.getElementById('newName').value = '';
                loadUserPermissions();
            }
        }

        // Admin: Lấy danh sách phân quyền
        async function loadUserPermissions() {
            const res = await fetch('/api/admin/users');
            const users = await res.json();
            const container = document.getElementById('userPermissionsList');
            container.innerHTML = '';

            users.forEach(u => {
                if (u.role === 'admin') return;
                const item = document.createElement('div');
                item.className = 'list-group-item d-flex justify-content-between align-items-center';
                item.innerHTML = `
                    <span><b>${u.name}</b> (${u.username})</span>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" ${u.canViewStats ? 'checked' : ''} onchange="togglePermission('${u.username}', this.checked)">
                        <label class="form-check-label">Cho phép xem thống kê</label>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Admin: Thay đổi quyền
        async function togglePermission(username, canViewStats) {
            await fetch('/api/admin/toggle-stats-permission', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, canViewStats })
            });
        }

        // Tải bảng thống kê báo cơm
        async function loadStats() {
            const res = await fetch('/api/meals');
            const data = await res.json();
            const tbody = document.getElementById('statsTableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.date}</td>
                    <td>${item.username}</td>
                    <td>${item.trua ? '✅' : '❌'}</td>
                    <td>${item.toi ? '✅' : '❌'}</td>
                    <td>${item.isLichTruc ? '🛡️' : '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
